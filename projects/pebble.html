<style>
:root{--paper:#f2e5d3;--ink:#171411;--muted:#3f3932;--orange:#6f2700;--focus:#005fcc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#d9c8b2;background-image:linear-gradient(rgba(255,255,255,.50),rgba(255,255,255,.50)),url("../assets/paper-texture-seamless.jpg");background-repeat:repeat;background-size:1024px auto;font-family:"DM Sans",Arial,sans-serif;line-height:1.6}

a{color:inherit}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.top{padding:26px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}.back{font-size:14px;text-decoration:none;border-bottom:1px solid currentColor}.toggle{border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:50%;width:44px;height:44px;cursor:pointer}.hero{padding:55px 0 75px}.eyebrow{font-size:12px;letter-spacing:.1em}.title{font-family:Kalam,cursive;font-weight:400;font-size:clamp(48px,7vw,88px);line-height:.98;max-width:850px}.title em{color:var(--orange);font-style:normal}.meta{color:var(--muted);font-size:15px}.image{width:100%;display:block;border:1px solid rgba(23,20,17,.2);background:rgba(251,243,232,.7)}.copy{padding:55px 28px 90px;max-width:760px;background:rgba(251,243,232,.88);border:1px solid rgba(23,20,17,.16);border-radius:4px}.copy h2{font-family:Kalam,cursive;font-weight:400;font-size:42px;line-height:1.05}.copy p{color:var(--muted);font-size:17px}.next{border-top:1px solid rgba(23,20,17,.3);padding:30px 0 60px;display:flex;justify-content:space-between;gap:20px}.next a{text-decoration:none}.next strong{display:block;font-family:Kalam,cursive;font-size:25px}
.external-links{width:min(1120px,calc(100% - 40px));margin:0 auto 28px;display:flex;flex-wrap:wrap;gap:10px}
.external-link{display:inline-flex;align-items:center;min-height:44px;padding:10px 15px;border:1px solid currentColor;border-radius:4px;background:rgba(251,243,232,.92);color:#171411;text-decoration:none;font-size:14px;font-weight:600}
.external-link:hover{text-decoration:underline}
body.dark .copy{background:rgba(24,24,24,.90);border-color:rgba(247,242,234,.22)}
body.dark .external-link{background:rgba(32,32,32,.94);color:#f7f2ea}
:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
@media(max-width:650px){.wrap{width:calc(100% - 28px)}.hero{padding:35px 0 45px}.copy{padding:35px 0 55px}.copy h2{font-size:35px}.top{padding:18px 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Responsive project page */
.scroll-progress{position:fixed;left:0;top:0;width:0;height:3px;background:var(--orange);z-index:9999}
.external-links{position:relative;z-index:2}
.image{max-height:78vh;object-fit:contain;transition:transform .5s ease}
.image:hover{transform:scale(1.008)}
@media(max-width:760px){
  .wrap{width:calc(100% - 28px)}
  .top{padding:18px 0}
  .hero{padding:35px 0 45px}

  .copy{padding:30px 20px 50px}
  .copy h2{font-size:35px}
  .external-links{width:calc(100% - 28px);gap:7px}
  .external-link{flex:1 1 180px;justify-content:center;text-align:center}
  .next{flex-direction:column}
}
@media(prefers-reduced-motion:reduce){.image{transition:none}}

<script>
const b=document.getElementById("toggle");
function apply(t){const d=t==="dark";document.body.classList.toggle("dark",d);b.setAttribute("aria-pressed",String(d));b.setAttribute("aria-label",d?"Switch to light mode":"Switch to dark mode");}
let t=null;try{t=localStorage.getItem("baranwal-theme")}catch(e){}
if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
apply(t);
b.addEventListener("click",()=>{const n=document.body.classList.contains("dark")?"light":"dark";apply(n);try{localStorage.setItem("baranwal-theme",n)}catch(e){}});
</script>

<script>
(() => {
  const progress = document.getElementById("scrollProgress");
  const update = () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    progress.style.width = `${max > 0 ? scrollY / max * 100 : 0}%`;
  };
  addEventListener("scroll", update, {passive:true});
  update();
})();
</script>

  <script src="../script.js"></script>
